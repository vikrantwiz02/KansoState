name: nightly

on:
  schedule:
    - cron: "0 2 * * *"  # 02:00 UTC daily
  workflow_dispatch:

jobs:
  fuzz-redact:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/sentinel-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: fuzz redact (60 s)
        run: go test -fuzz=FuzzRedactorRoundtrip -fuzztime=60s ./test/...
      - name: fuzz redact unit (60 s)
        run: go test -fuzz=FuzzRedact -fuzztime=60s ./internal/redact/...

  bench-baselines:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/sentinel-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: run benchmarks
        run: go test -bench=. -benchmem -count=3 -run='^$' ./... | tee bench-results.txt
      # Regression guard, not a target. Consensus.Update runs ~4 passes over a
      # 384-dim float32 vector plus one clone allocation; observed baseline is
      # ~1300 ns/op on CI runners and ~1900 ns/op locally. The gate sits at 3000
      # ns/op (~1.5x the slowest observed) to catch a genuine regression while
      # tolerating shared-runner variance.
      - name: gate consensus bench (regression guard, <= 3000 ns/op)
        run: |
          ops=$(grep 'BenchmarkConsensus_Update' bench-results.txt | awk '{print $3}' | head -1 | tr -d 'ns/op')
          echo "consensus: ${ops} ns/op"
          [ "${ops}" -le 3000 ] || (echo "FAIL: consensus bench ${ops} ns/op > 3000 ns/op gate" && exit 1)
      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: services/sentinel-go/bench-results.txt
